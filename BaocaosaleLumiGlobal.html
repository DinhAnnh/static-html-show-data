<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <title>Báo Cáo Sale LumiGlobal</title>
  <style>
    :root {
      --primary-color: #0056b3;
      --primary-color-dark: #003d82;
      --success-color: #28a745;
      --danger-color: #dc3545;
      --info-color: #17a2b8;
      --light-gray: #f8f9fa;
      --medium-gray: #ddd;
      --dark-gray: #333;
      --border-radius: 6px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--light-gray);
      color: var(--dark-gray);
      line-height: 1.6;
    }

    .container {
      max-width: 95vw;
      margin: 2rem auto;
      background-color: white;
      border-radius: var(--border-radius);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 2rem;
    }

    .header {
      display: flex;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 2px solid var(--primary-color);
    }

    .logo {
      height: 60px;
      margin-right: 1.5rem;
    }

    h1 {
      color: var(--primary-color);
      margin: 0;
      font-weight: 600;
      font-size: 2rem;
    }

    .table-wrapper {
      overflow-x: auto;
      border: 1px solid var(--medium-gray);
      border-radius: var(--border-radius);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
      table-layout: fixed;
    }

    th,
    td {
      border: 1px solid var(--medium-gray);
      padding: 0.8rem 1rem;
      text-align: left;
      vertical-align: middle;
      white-space: nowrap;
      word-wrap: break-word;
    }

    th {
      background-color: var(--primary-color);
      color: white;
      font-weight: 500;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    tr:nth-child(even) {
      background-color: var(--light-gray);
    }

    tr:hover {
      background-color: #e9ecef;
    }

    input,
    textarea,
    button,
    select {
      box-sizing: border-box;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--medium-gray);
      border-radius: var(--border-radius);
      width: 100%;
      font-family: inherit;
      font-size: 1.1rem;
      font-weight: 500;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    td input,
    td select {
      white-space: normal;
      height: auto;
      min-height: 42px;
    }

    input:focus,
    select:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(0, 86, 179, 0.2);
      outline: none;
    }

    button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: var(--primary-color-dark);
    }

    .action-buttons {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
    }

    .action-buttons button {
      padding: 0.4rem 0.6rem;
    }

    .add-row-btn {
      background-color: var(--success-color);
      margin-bottom: 1.5rem;
      padding: 0.75rem 1.5rem;
      font-size: 1.1rem;
    }

    .add-row-btn:hover {
      background-color: #218838;
    }

    .submit-btn {
      background-color: var(--danger-color);
      margin-top: 1.5rem;
      padding: 0.75rem 1.5rem;
      font-size: 1.1rem;
    }

    .submit-btn:hover {
      background-color: #c82333;
    }

    #responseMessage {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: var(--border-radius);
      text-align: center;
      font-weight: bold;
    }

    .success {
      background-color: #d4edda;
      color: #155724;
    }

    .error {
      background-color: #f8d7da;
      color: #721c24;
    }

    .error-cell {
      background-color: #f8d7da !important;
      border: 1px solid var(--danger-color) !important;
    }

    .hidden {
      display: none;
    }

    .addSimilar {
      background-color: var(--info-color);
    }

    .addSimilar:hover {
      background-color: #138496;
    }

    .removeRow {
      background-color: #6c757d;
    }

    .removeRow:hover {
      background-color: #5a6268;
    }

    tr[data-marked-for-deletion="true"] {
      text-decoration: line-through;
      opacity: 0.6;
    }

    .input-container {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .input-container input,
    .input-container select {
      flex-grow: 1;
    }

    .input-container .addSimilar {
      flex-shrink: 0;
      width: 42px;
      height: 42px;
      padding: 0;
      font-size: 1.2rem;
    }

    .status {
      background: #e9ecef;
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
      font-size: 14px;
      color: #495057;
    }

    /* CSS để điều chỉnh chiều rộng cột */
    #dataTable th:nth-child(1) {
      width: 80px;
    }

    #dataTable th:nth-child(2),
    #dataTable th:nth-child(5) {
      width: 250px;
    }

    #dataTable th:nth-child(3),
    #dataTable th:nth-child(4),
    #dataTable th:nth-child(6),
    #dataTable th:nth-child(7),
    #dataTable th:nth-child(8) {
      width: 150px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <img
        src="https://www.appsheet.com/template/gettablefileurl?appName=Appsheet-325045268&tableName=Kho%20%E1%BA%A3nh&fileName=Kho%20%E1%BA%A3nh_Images%2Ff930e667.%E1%BA%A2nh.025539.jpg"
        alt="LumiGlobal Logo" class="logo">
      <h1>Báo Cáo Sale LumiGlobal</h1>
    </div>

    <div class="status" id="status">Ứng dụng đã sẵn sàng.</div>

    <button id="addRowBtn" type="button" class="add-row-btn">➕ Thêm dòng trống</button>

    <form id="dataForm" novalidate>
      <div class="table-wrapper">
        <table id="dataTable">
          <thead>
            <tr>
              <th>Hành động</th>
              <th>Tên</th>
              <th>Ngày</th>
              <th>Ca</th>
              <th>Sản phẩm</th>
              <th>Thị trường</th>
              <th>Số Mess</th>
              <th>Phản hồi</th>
            </tr>
          </thead>
          <tbody id="tableBody">
          </tbody>
        </table>
      </div>
      <button type="submit" id="submitBtn" class="submit-btn">🚀 Gửi báo cáo</button>
    </form>

    <div id="responseMessage"></div>
    <datalist id="employee-datalist"></datalist>
  </div>

  <script>
    let appData = {
      employeeList: ["Trần Thị Ngọc Ánh", "Dương Thị Hạnh", "Dương Đức Mạnh", "Trần Thị Hồng Nhung", "Bùi Thị Thu Huyền", "Nguyễn Duy Đức", "Nguyễn Thị Thảo", "Đặng Thị Nga", "Phạm Thị Yến", "Phạm Thị Lệ", "Nguyễn Thị Ánh Nguyệt", "Đinh Thị Hoài Thư", "Nguyễn Mỹ Duyên", "Phạm Văn Đạt", "Nguyễn Anh Điệp", "Nguyễn Tiến Mạnh", "Giang Kiều Duyên", "Hoàng Thị Uyên", "Hoàng Thảo Nguyên", "Phạm Thị Huyền Trang", "Nguyễn Mạnh Tú", "Phan Thu Hương", "Trần Uy Vũ", "Nguyễn Thị Ánh Nguyệt 1", "Hồ Thanh Tiện", "Lê Nguyễn Mai Khanh", "Trần Thị Mỹ Vân", "Lê Thị Diễm Hằng", "Nguyễn Trung Luận", "Lê Hải Huyền Vy", "Trịnh Ngọc Thanh Phương", "Nguyễn Thị Lan Anh", "Nguyễn Thị Thanh Tuyền", "Nguyễn Thị Lan Anh 2", "Thái Thị Kim Chi", "Đỗ Thúy Hiền", "Nguyễn Thị Mỹ Uyên", "Mã Tuyết Nhi", "Nguyễn Thị Dương", "Trần Ngọc Kim Thùy", "Nguyễn Thùy Trang", "Vũ Thị Phương Thanh", "Phan Nhân", "Trang Trọng Tín", "Nguyễn Thị Thu Trang", "Nguyễn Tuyết Nhi", "Trần Thị Kim Anh", "Phạm Hải Yến", "Trần Thị Nhung", "Lê Ngọc Đài Trang", "Đỗ Thị Thu Hằng", "Mai Thị Lý", "Khổng Thị Ngọc"],
      shiftList: ["Hết ca", "Cuối ca"],
      productList: ["Fitgum CAFE 20X", "Kem Body", "Bakuchiol Retinol", "Serum sâm", "Glutathione Collagen", "Glutathione Collagen NEW", "DG", "Nám DR Hancy", "Kẹo Táo", "Gel Xương Khớp"],
      marketList: ["Nhật Bản", "Hàn Quốc", "Canada", "US", "Úc", "Anh"],
    };

    const tableBody = document.getElementById('tableBody');
    const addRowBtn = document.getElementById('addRowBtn');
    const submitBtn = document.getElementById('submitBtn');
    const form = document.getElementById('dataForm');
    const statusDiv = document.getElementById('status');
    const respMsg = document.getElementById('responseMessage');
    const employeeDatalist = document.getElementById('employee-datalist');
    let rowCounter = 0;
    let userEmail = ''; // Biến để lưu email

    function updateStatus(message, isError = false) {
      console.log(`[STATUS] ${isError ? 'ERROR' : 'INFO'}: ${message}`);
      statusDiv.textContent = new Date().toLocaleTimeString() + ': ' + message;
      statusDiv.style.color = isError ? '#721c24' : '#495057';
      statusDiv.style.backgroundColor = isError ? '#f8d7da' : '#e9ecef';
    }

    function getToday() {
      const today = new Date();
      return today
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    function createOptions(list, selectedValue = '') {
      return list.map(item => `<option value="${escapeHtml(item)}" ${item === selectedValue ? 'selected' : ''}>${escapeHtml(item)}</option>`).join('');
    }

    function populateEmployeeDatalist() {
      appData.employeeList.sort((a, b) => a.localeCompare(b, 'vi'));
      employeeDatalist.innerHTML = appData.employeeList.map(item => `<option value="${escapeHtml(item)}"></option>`).join('');
    }

    function formatNumberInput(input) {
      let value = input.value.replace(/[^0-9]/g, '');
      input.value = value ? new Intl.NumberFormat('de-DE').format(value) : '';
    }

    function addNewRow(data = {}, insertAfterElement = null, isNew = true) {
      rowCounter++;
      const row = document.createElement('tr');
      row.dataset.rowId = `row${rowCounter}`;
      row.dataset.isNew = isNew;

      const soMessFormatted = data['Số Mess'] ? new Intl.NumberFormat('de-DE').format(data['Số Mess']) : '';
      const phanHoiFormatted = data['Phản hồi'] ? new Intl.NumberFormat('de-DE').format(data['Phản hồi']) : '';

      row.innerHTML = `
        <td class="action-buttons"><button type="button" class="removeRow" onclick="removeRow(this)">❌</button></td>
        <td><input name="Tên" list="employee-datalist" placeholder="-- Chọn hoặc nhập tên --" value="${escapeHtml(data.Tên || '')}" autocomplete="off"></td>
        <td><input name="Ngày" type="date" value="${data.Ngày || getToday()}"></td>
        <td><select name="Ca"><option value="">-- Chọn ca --</option>${createOptions(appData.shiftList, data.Ca)}</select></td>
        <td><select name="Sản phẩm"><option value="">-- Chọn sản phẩm --</option>${createOptions(appData.productList, data['Sản phẩm'])}</select></td>
        <td>
          <div class="input-container">
            <select name="Thị trường"><option value="">-- Chọn thị trường --</option>${createOptions(appData.marketList, data['Thị trường'])}</select>
            <button type="button" class="addSimilar" onclick="addSimilarRow(this)">➕</button>
          </div>
        </td>
        <td><input name="Số Mess" type="text" inputmode="numeric" value="${soMessFormatted}" autocomplete="off"></td>
        <td><input name="Phản hồi" type="text" inputmode="numeric" value="${phanHoiFormatted}" autocomplete="off"></td>
        <td class="hidden"><input name="id" value="${data.id || 'id_' + Date.now() + rowCounter}" readonly></td>`;

      if (insertAfterElement) insertAfterElement.after(row);
      else tableBody.appendChild(row);

      return row;
    }

    function removeRow(button) {
      const row = button.closest('tr');
      // Nếu là dòng mới (chưa có trên server), xóa luôn
      if (row.dataset.isNew === 'true') {
        row.remove();
        return;
      }
      // Nếu là dòng đã tồn tại, đánh dấu để xóa
      row.dataset.markedForDeletion = 'true';
      row.querySelectorAll('input, select, .addSimilar').forEach(el => el.disabled = true);
      button.textContent = '↩️'; // Biểu tượng hoàn tác
      button.onclick = () => undoRemove(button);
    }
    window.removeRow = removeRow;

    function undoRemove(button) {
      const row = button.closest('tr');
      delete row.dataset.markedForDeletion;
      row.querySelectorAll('input, select, .addSimilar').forEach(el => el.disabled = false);
      button.textContent = '❌';
      button.onchange = () => removeRow(button);
    }
    window.undoRemove = undoRemove;

    function addSimilarRow(button) {
      const currentRow = button.closest('tr');
      const data = {};
      currentRow.querySelectorAll('input, select').forEach(input => {
        if (input.name && input.name !== 'id' && input.name !== 'Số Mess' && input.name !== 'Phản hồi') {
          data[input.name] = input.value;
        }
      });
      addNewRow(data, currentRow, true);
    }
    window.addSimilarRow = addSimilarRow;

    function validateForm() {
      document.querySelectorAll('.error-cell').forEach(cell => cell.classList.remove('error-cell'));
      let isValid = true;
      const rows = tableBody.querySelectorAll('tr:not([data-marked-for-deletion="true"])');

      if (!userEmail) {
        respMsg.className = 'error';
        respMsg.textContent = 'Lỗi: Không tìm thấy email người dùng. Vui lòng kiểm tra lại URL.';
        return false;
      }

      if (tableBody.querySelectorAll('tr').length === 0) {
        respMsg.className = 'error';
        respMsg.textContent = 'Chưa có dòng nào để gửi!';
        return false;
      }

      rows.forEach(row => {
        ['Tên', 'Ngày', 'Ca', 'Sản phẩm', 'Thị trường'].forEach(fieldName => {
          const input = row.querySelector(`[name="${fieldName}"]`);
          if (input && !input.value.trim()) {
            isValid = false;
            input.closest('td').classList.add('error-cell');
          }
        });
      });

      respMsg.className = isValid ? '' : 'error';
      respMsg.textContent = isValid ? '' : 'Lỗi: Vui lòng điền đầy đủ thông tin cho các ô màu đỏ.';
      return isValid;
    }

    async function handleSubmit(e) {
      e.preventDefault();
      if (!validateForm()) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Đang gửi...';

      const rowsToAdd = [];
      const rowsToEdit = [];
      const rowsToDelete = [];

      // Phân loại các dòng: Thêm, Sửa, Xóa
      tableBody.querySelectorAll('tr').forEach(row => {
        const rowData = {};

        // 1. Gom các dòng để XÓA
        if (row.dataset.markedForDeletion === 'true') {
          const id = row.querySelector('input[name="id"]').value;
          // AppSheet chỉ cần Primary Key để xóa
          if (id) rowsToDelete.push({ "id": id });
          return; // Bỏ qua, không xử lý thêm cho dòng này
        }

        // 2. Gom các dòng để THÊM hoặc SỬA
        row.querySelectorAll('input, select').forEach(input => {
          if (input.name) {
            const key = input.name === 'Số Mess' ? 'Số mess' : input.name;
            rowData[key] = (input.name === 'Số Mess' || input.name === 'Phản hồi')
              ? input.value.replace(/\./g, '')
              : input.value || 0;
          }
        });

        if (row.dataset.isNew === 'true') {
          rowsToAdd.push(rowData);
        } else {
          rowsToEdit.push(rowData);
        }
      });

      const APPSHEET_API_URL = 'https://www.appsheet.com/api/v2/app/f9aacd5a-8966-5b1-b20c-c8f5ea6c63b/tbles/Sale%2b%C3%A1o%20cC3%A1o/Action';
      const APP_ACCESS_KEY = 'V2-w2Id-wgEc-NToRD-xUHk-CPMlL-44lVt-NHJ3-DeMAp';

      const apiPromises = [];

      // Chuẩn bị yêu cầu ADD
      if (rowsToAdd.length > 0) {
        const addPayload = { "Action": "Add", "Properties": { "RunAsUserEmail": userEmail }, "Rows": rowsToAdd };
        apiPromises.push(fetch(APPSHEET_API_URL, { method: 'PATH', headers: { 'Content-Type': 'application/json', 'ApplicationAccessKey': APP_ACCESS_KEY }, body: JSON.stringify(addPayload) }));
      }

      // Chuẩn bị yêu cầu EDIT
      if (rowsToEdit.length > 0) {
        const editPayload = { "Action": "Edit", "Properties": { "RunAsUserEmail": userEmail }, "Rows": rowsToEdit };
        apiPromises.push(fetch(APPSHEET_API_URL, { method: 'GET', headers: { 'Content-Type': 'application/json', 'ApplicationAccessKey': APP_ACCESS_KEY }, body: JSON.stringify(editPayload) }));
      }

      // Chuẩn bị yêu cầu DELETE
      if (rowsToDelete.length > 0) {
        const deletePayload = { "Action": "Delete", "Properties": { "RunAsUserEmail": userEmail }, "Rows": rowsToDelete };
        apiPromises.push(fetch(APPSHEET_API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json', 'ApplicationAccessKey': APP_ACCESS_KEY }, body: JSON.stringify(deletePayload) }));
      }

      // Nếu không có hành động nào thì không làm gì cả
      if (apiPromises.length === 0) {
        respMsg.className = '';
        respMsg.textContent = 'Không có thay đổi nào để gửi.';
        submitBtn.disabled = false;
        submitBtn.textContent = '🚀 Gửi báo cáo';
        return;
      }

      try {
        const responses = await Promise.all(apiPromises);

        for (const response of responses) {
          if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`API trả về lỗi ${response.status}: ${errorText}`);
          }
        }

        respMsg.className = 'success';
        respMsg.textContent = `Gửi báo cáo thành công! (${rowsToAdd.length} dòng thêm, ${rowsToEdit.length} dòng cập nhật, ${rowsToDelete.length} dòng đã xóa)`;
        tableBody.innerHTML = '';
        rowCounter = 0;
        const urlParams = new URLSearchParams(window.location.search);
        const employeeNameFromUrl = urlParams.get('hoten');
        await fetchAndPopulateInitialData(employeeNameFromUrl);
        updateStatus('Hoàn thành gửi báo cáo và đã làm mới dữ liệu.');

      } catch (error) {
        respMsg.className = 'error';
        respMsg.textContent = 'Lỗi khi gửi dữ liệu: ' + error.message;
        updateStatus('Gửi báo cáo thất bại: Lỗi mạng hoặc server', true);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '🚀 Gửi báo cáo';
      }
    }

    async function fetchAndUpdateDynamicLists() {
      const DATA_URL = 'https://script.google.com/macros/s/AKfycbwXpref54ChZaJ2IFZYugRlHsHcTjmM_D0XqspT_wwFOQmgKhb3RsEDxqtPa5XxOQKgd/exec';
      try {
        updateStatus('Đang cập nhật danh sách động (Sản phẩm/Thị trường)...');
        const response = await fetch(DATA_URL);
        if (!response.ok) throw new Error(`Lỗi mạng: ${response.status}`);

        const loadedData = await response.json();

        let dataUpdated = false;
        if (loadedData.marketList && loadedData.marketList.length > 0) {
          appData.marketList = loadedData.marketList;
          dataUpdated = true;
        }
        if (loadedData.productList && loadedData.productList.length > 0) {
          appData.productList = loadedData.productList;
          dataUpdated = true;
        }

        if (dataUpdated) {
          document.querySelectorAll('tr[data-row-id]').forEach(row => {
            const marketSelect = row.querySelector('select[name="Thị trường"]');
            const productSelect = row.querySelector('select[name="Sản phẩm"]');
            if (marketSelect && productSelect) {
              const currentMarket = marketSelect.value;
              const currentProduct = productSelect.value;
              marketSelect.innerHTML = `<option value="">-- Chọn thị trường --</option>${createOptions(appData.marketList, currentMarket)}`;
              productSelect.innerHTML = `<option value="">-- Chọn sản phẩm --</option>${createOptions(appData.productList, currentProduct)}`;
            }
          });
          updateStatus('Cập nhật danh sách động thành công!');
        } else {
          updateStatus('Không có dữ liệu động mới.');
        }

      } catch (error) {
        console.error("Lỗi khi tải dữ liệu động:", error);
        updateStatus(`Không thể cập nhật danh sách động. Sử dụng dữ liệu dự phòng. Lỗi: ${error.message}`, true);
      }
    }

    async function fetchAndPopulateInitialData(employeeName, tuNgay, denNgay) {
      if (!employeeName) {
        updateStatus('Không tìm thấy tên nhân viên (tham số "hoten") trong URL.', true);
        addNewRow({}, null, true);
        return;
      }

      const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwXpef54ChZaJ2IFZYugRlHsHcTjmM_D0XqspT_wwFOQmgKhb3RsEDxqtPa5XxOQKgd/exec';
      updateStatus(`Đang tải dữ liệu báo cáo cho ${employeeName}...`);

      try {
        const response = await fetch(SCRIPT_URL);
        const allData = await response.json();
        const reportData = allData || [];
        const tuNgayDate = tuNgay ? new Date(tuNgay) : new Date();
        const denNgayDate = denNgay ? new Date(denNgay) : new Date();
        const employeeTodayData = reportData.filter(row => {
          const rowDate = new Date(row.ngay);
          //trong khoảng tuNgay, denNgay
          return row.ten === employeeName && rowDate.getDate() >= tuNgayDate.getDate() && rowDate.getDate() <= denNgayDate.getDate() &&
            rowDate.getMonth() >= tuNgayDate.getMonth() && rowDate.getMonth() <= denNgayDate.getMonth() && rowDate.getFullYear() >= tuNgayDate.getFullYear() && rowDate.getFullYear() <= denNgayDate.getFullYear();
        });


        if (employeeTodayData.length > 0) {
          updateStatus(`Tìm thấy ${employeeTodayData.length} bản ghi hôm nay cho ${employeeName}. Đang hiển thị...`);
          employeeTodayData.forEach(rowData => {
            const formattedRowData = {
              "Tên": rowData.ten || employeeName,
              "Ngày": new Date(rowData.ngay).toLocaleDateString('en-CA'),
              "Ca": rowData.ca || '',
              "Sản phẩm": rowData.sanPham || '',
              "Thị trường": rowData.thiTruong || '',
              "Số Mess": rowData.soMess || 0,
              "Phản hồi": rowData.phanHoi || 0,
              "id": rowData.id
            };
            addNewRow(formattedRowData, null, false);
          });
        } else {
          updateStatus(`Không tìm thấy báo cáo nào hôm nay cho ${employeeName}. Bắt đầu với một dòng mới.`);
          addNewRow({ Tên: employeeName }, null, true);
        }
      } catch (error) {
        console.error("Lỗi khi tải dữ liệu ban đầu:", error);
        updateStatus(`Không thể tải dữ liệu báo cáo. Bắt đầu với một dòng mới. Lỗi: ${error.message}`, true);
        addNewRow({ Tên: employeeName }, null, true);
      }
    }

    async function initializeApp() {
      const urlParams = new URLSearchParams(window.location.search);
      userEmail = urlParams.get('email');
      const employeeNameFromUrl = urlParams.get('hoten');
      const tuNgay = urlParams.get('tuNgay')
      const denNgay = urlParams.get('denNgay')

      populateEmployeeDatalist();

      await fetchAndPopulateInitialData(employeeNameFromUrl, tuNgay, denNgay);
      await fetchAndUpdateDynamicLists();

      form.addEventListener('submit', handleSubmit);
      addRowBtn.addEventListener('click', () => addNewRow({ Tên: employeeNameFromUrl }, null, true));

      tableBody.addEventListener('input', e => {
        if (e.target.matches('[name="Số Mess"], [name="Phản hồi"]')) {
          formatNumberInput(e.target);
        }
      });
    }

    document.addEventListener('DOMContentLoaded', initializeApp);
  </script>
</body>
